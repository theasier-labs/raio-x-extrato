name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Leitores, análise e relatório
        run: npm test
      - name: Política de segurança e nenhuma API de rede
        run: npm run test:seguranca
